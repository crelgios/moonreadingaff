  <style>
    * {

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 410px;
      background: white;
      padding: 22px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);

    h1 {

      line-height: 1.3;

      margin-bottom: 20px;
    }

    .video-box {

    }

    video {
      width: 100%;

    }

    .video-error {
      display: none;
      background: #fff4f4;
      color: #b00020;
      font-size: 13px;
      line-height: 1.4;
      padding: 12px;
      border-radius: 12px;
      margin: -10px 0 18px;

    .video-error a {

      box-shadow: 0 10px 22px rgba(255, 75, 43, 0.45);

    .learn-btn:hover {

    </p>

  <script>
    const video = document.getElementById('mainVideo');
    const videoError = document.getElementById('videoError');

    video.addEventListener('loadedmetadata', function () {
      videoError.style.display = 'none';
    });

    video.addEventListener('error', function () {
      videoError.style.display = 'block';
    });
  </script>

</body>
